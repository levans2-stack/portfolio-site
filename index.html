<!-- Contact -->
<section id="contact" class="contact-section">

    <div class="section-title">

        <p class="eyebrow">LET'S CONNECT</p>

        <h2>🌸 Contact Me 🌸</h2>

        <p>
            Interested in connecting, discussing an opportunity,
            or learning more about my work?
        </p>

        <p>
            📧 Email me at:
            <a href="mailto:lailaniejobs@gmail.com">
                lailaniejobs@gmail.com
            </a>
        </p>

    </div>


    <form id="contactForm" novalidate>

        <div>
            <label for="name">Name *</label>

            <input
                type="text"
                id="name"
                name="name"
                autocomplete="name"
                aria-describedby="nameError"
                required>

            <p
                id="nameError"
                class="error"
                aria-live="polite">
            </p>
        </div>


        <div>
            <label for="email">Your Email *</label>

            <input
                type="email"
                id="email"
                name="email"
                autocomplete="email"
                aria-describedby="emailError"
                required>

            <p
                id="emailError"
                class="error"
                aria-live="polite">
            </p>
        </div>


        <div>
            <label for="message">Message *</label>

            <textarea
                id="message"
                name="message"
                rows="5"
                aria-describedby="messageError"
                required></textarea>

            <p
                id="messageError"
                class="error"
                aria-live="polite">
            </p>
        </div>


        <button type="submit">
            Send Message ✨
        </button>

        <p
            id="successMessage"
            class="success"
            aria-live="polite">
        </p>

    </form>

</section>
